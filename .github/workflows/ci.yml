name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Build Docker images
        run: docker compose build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: List Docker images
        run: docker image ls

      - name: Tag Docker images
        run: |
          docker tag minishop-productservice:latest ghcr.io/${{ github.repository_owner }}/microservicessample-productservice:latest
          docker tag minishop-orderservice:latest ghcr.io/${{ github.repository_owner }}/microservicessample-orderservice:latest
          docker tag minishop-notificationservice:latest ghcr.io/${{ github.repository_owner }}/microservicessample-notificationservice:latest
          docker tag minishop-apigateway:latest ghcr.io/${{ github.repository_owner }}/microservicessample-apigateway:latest